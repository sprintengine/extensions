name: Index community extensions

# Lists every public repository tagged `sprintengine-extension` in
# community.json, hourly. It commits only when something changed.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache the SDK build
        uses: actions/cache@v4
        with:
          path: .sdk
          key: sdk-${{ hashFiles('sdk.json', 'scripts/setup-sdk.sh') }}

      - name: Build the SDK at the pinned commit
        run: scripts/setup-sdk.sh

      - name: Index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/cli.ts index

      - name: Check the files before committing
        run: node src/cli.ts check --base HEAD

      - name: Commit what changed
        run: |
          git add -A -- community.json owners.json release-lock.json identities.json status.json images
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Community catalogue from $(git rev-parse --short HEAD)"
          git push origin HEAD:main
